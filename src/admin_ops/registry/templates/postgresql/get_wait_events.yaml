template_id: pg_get_wait_events
engine: postgresql
tool_function_name: get_wait_events
tier: 1
description: Active wait events grouped by type and event from pg_stat_activity.
owner: dbops-platform
parameters: []
body: |
  SELECT wait_event_type, wait_event, COUNT(*) as session_count,
         SUM(EXTRACT(EPOCH FROM (now() - query_start)))::int as total_wait_sec
  FROM pg_stat_activity
  WHERE state != 'idle' AND wait_event IS NOT NULL AND pid != pg_backend_pid()
  GROUP BY wait_event_type, wait_event
  ORDER BY session_count DESC;
version: 1
